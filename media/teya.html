<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teya — card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<style>
/* one card centred on a field; turning it over inverts the page — paper ↔ ink */
:root {
  --paper: #f1efeb;
  --paper-ink: #2a2826;
  --ink: #161514;
  --ink-paper: #e9e6e1;
  --bg: var(--paper);
  --fg: var(--paper-ink);
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--mono); font-size: 12px;
  transition: background-color .7s ease, color .7s ease;
  overflow-x: hidden;
}
body.inv { --bg: var(--ink); --fg: var(--ink-paper); }

.wrap {
  min-height: 100%;
  display: grid; grid-template-rows: auto 1fr auto; gap: 16px;
  padding-block: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row p { margin: 0; }
.side { font-weight: 500; }

.scene { display: grid; place-items: center; perspective: 1400px; }
.card {
  position: relative;
  width: min(640px, 100%);
  aspect-ratio: 1540 / 886;
  transform-style: preserve-3d;
  transition: transform .9s cubic-bezier(.3,.7,.2,1);
  cursor: pointer;
  border: 0; padding: 0; background: none;
  --rx: 0deg; --ry: 0deg; --flip: 0deg;
  transform: rotateX(var(--rx)) rotateY(calc(var(--ry) + var(--flip)));
}
.card:focus-visible { outline: 2px solid var(--fg); outline-offset: 8px; }
.face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: #fff center / cover no-repeat;
  box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 24px 40px -14px rgba(20,18,16,.45);
}
.face.b { transform: rotateY(180deg); }
.face::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.18), transparent 40%, transparent 70%, rgba(0,0,0,.05));
}
body.inv .card { --flip: 180deg; }

@media (prefers-reduced-motion: reduce) { body, .card { transition: none; } }
</style>
</head>

  <div class="row">
    <p class="side" id="side">side A — drawing</p>
    <p id="how">click to flip</p>
  </div>
</div>

<script>
const card = document.getElementById("card");
const side = document.getElementById("side");
const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
document.getElementById("how").textContent = fine ? "click to flip" : "tap to flip";

function set(inv) {
  document.body.classList.toggle("inv", inv);
  side.textContent = inv ? "side B — about him" : "side A — drawing";
}

if (fine) {
  // slight tilt toward the cursor, like holding the card in hand
  card.addEventListener("pointerleave", () => { card.style.setProperty("--rx", "0deg"); card.style.setProperty("--ry", "0deg"); });
  card.addEventListener("pointermove", (e) => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
    card.style.setProperty("--ry", (px * 14) + "deg");
    card.style.setProperty("--rx", (-py * 12) + "deg");
  });
}
card.addEventListener("click", () => set(!document.body.classList.contains("inv")));
</script>
